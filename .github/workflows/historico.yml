name: Baixar histórico longo (backtest)

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Período (ex.: 20y, 10y, max)"
        default: "20y"
  push:
    paths:
      - ".github/workflows/historico.yml"
      - "config/watchlist.json"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar histórico
        run: python scripts/baixar_historico.py --periodo "${{ github.event.inputs.periodo || '20y' }}"
      - name: Coleta do dia (sinais atuais)
        run: python scripts/atualizar_dados.py --periodo 2y
      - name: Salvar no repositório
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: histórico e coleta $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
