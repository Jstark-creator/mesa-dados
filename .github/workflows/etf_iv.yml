name: Histórico ETFs + índices de IV (laboratório de opções)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etf_iv.yml"
      - "scripts/baixar_etf_iv.py"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p data/etf
          python scripts/baixar_etf_iv.py 2>&1 | tee data/etf/_log.txt
      - name: Salvar no repositório
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data/etf
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: ETFs e índices de IV $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
