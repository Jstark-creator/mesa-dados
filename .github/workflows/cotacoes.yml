name: Cotações a cada 30 min

on:
  schedule:
    # pregão EUA/B3 (seg–sex, 12h–21h UTC = 9h–18h Asunción) a cada 30 min
    - cron: "*/30 12-21 * * 1-5"
    # cripto e fora do pregão: a cada 2 horas, todos os dias
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/cotacoes.py
      - name: Salvar
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data/cotacoes.json
          git diff --cached --quiet && exit 0
          git commit -m "cotações $(date -u +%H:%M)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
