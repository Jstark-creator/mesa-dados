name: M7 Preço da volatilidade (cotações reais)

on:
  workflow_dispatch:
  push:
    paths:
      - "config/m7.json"

permissions:
  contents: write

concurrency:
  group: m7
  cancel-in-progress: false

jobs:
  m7:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt scipy tabulate
      - name: Restaurar dados brutos da ThetaData (cache do Actions)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/td
          key: thetadata-eod-v1-nao-existe
          restore-keys: thetadata-eod-v1-
      - name: Conferir dados
        run: |
          ls /tmp/td || (echo "cache da ThetaData não encontrado" && exit 1)
          for d in /tmp/td/*/; do echo "$d $(ls $d | wc -l) meses"; done
      - name: Fechamentos não ajustados
        run: |
          python - <<'PY'
          import yfinance as yf, pandas as pd
          sims = ["SPY","QQQ","IWM","DIA","XLK","XLF","XLE","SMH","GLD","TLT","EEM","XBI"]
          d = yf.download(sims, start="2023-01-01", auto_adjust=False, progress=False)["Close"]
          d.index = pd.to_datetime(d.index).tz_localize(None)
          d.to_csv("/tmp/td/spot.csv"); print(d.tail(2))
          PY
      - name: Rodar M7
        run: python scripts/lab/m7/m7.py --dados /tmp/td --spot /tmp/td/spot.csv
      - name: Salvar resultados (só agregados e operações simuladas)
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data/lab/m7
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "laboratório: M7 preço da volatilidade (cotações reais)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
