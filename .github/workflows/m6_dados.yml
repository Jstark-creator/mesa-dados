name: Dados do método M6 (histórico de ações EUA)

on:
  workflow_dispatch:
  push:
    paths:
      - "config/universo_m6.json"
      - "scripts/baixar_universo.py"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p data/lab/m6
          python scripts/baixar_universo.py config/universo_m6.json 2>&1 | tee data/lab/m6/_log_historico.txt
      - name: Salvar
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data/historico data/lab/m6
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: universo M6 $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
