name: Histórico cripto (laboratório J.Satoshi)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cripto_hist.yml"
      - "scripts/baixar_cripto.py"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  cripto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar histórico cripto
        run: python scripts/baixar_cripto.py | tee data/cripto/_log.txt
      - name: Salvar no repositório
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: histórico cripto $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
