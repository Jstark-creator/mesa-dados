name: Sinais cripto (J.Satoshi)

on:
  schedule:
    - cron: "25 0 * * *"   # 00:25 UTC = 21:25 Asunción, logo após o fechamento do candle diário
  workflow_dispatch:
  push:
    paths:
      - "scripts/cripto.py"
      - ".github/workflows/cripto.yml"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  sinais:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/cripto.py
      - name: Salvar no repositório
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data/cripto/sinais.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: sinais cripto $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
