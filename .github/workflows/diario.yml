name: Coleta diária e sinais M3

on:
  schedule:
    # 22:15 UTC = 19:15 em Asunción/Brasília, depois do fechamento da B3 e de NY (seg–sex)
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar dados e detectar sinais
        run: python scripts/atualizar_dados.py --periodo 2y
      - name: Salvar no repositório
        run: |
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "dados: coleta $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
